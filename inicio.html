<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sistema de denuncias</title>
<style>
  :root { --fondo:#1c2632; --oro:#b08251; --oro-claro:#d1ac75; --txt:#e9e4da; --suave:#a9b2bd; --linea:#b0825138;
          box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--fondo); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden }

  /* Olas doradas de fondo (se desplazan despacio) */
  .olas { position:fixed; left:0; bottom:0; width:200%; height:42vh; pointer-events:none; fill:none; stroke:var(--oro); }
  .olas path { vector-effect:non-scaling-stroke; stroke-width:1 }
  .olas.a { opacity:.38; animation:deriva 34s linear infinite }
  .olas.b { opacity:.18; height:34vh; animation:deriva 58s linear infinite reverse }
  @keyframes deriva { to { transform:translateX(-50%) } }

  main { position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.2rem 1.4rem 5rem; text-align:center }
  .logo-caja { position:relative; width:min(78vw,340px) }
  .halo { position:absolute; inset:-14%; border-radius:50%; background:radial-gradient(circle,#b0825138 0%,transparent 62%); animation:respira 4.8s ease-in-out infinite }
  .marco { position:relative; -webkit-mask-image:radial-gradient(ellipse at center,#000 64%,transparent 100%); mask-image:radial-gradient(ellipse at center,#000 64%,transparent 100%); animation:entra 1.1s ease-out both, flota 7s ease-in-out 1.1s infinite }
  .marco img { display:block; width:100% }
  .brillo { position:absolute; inset:0; background:linear-gradient(105deg,transparent 42%,#ffe1a526 50%,transparent 58%); background-size:260% 100%; mix-blend-mode:screen; animation:barrido 5.5s ease-in-out infinite }
  @keyframes entra { from { opacity:0; transform:translateY(10px) scale(.97) } to { opacity:1; transform:none } }
  @keyframes flota { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
  @keyframes respira { 0%,100% { opacity:.55; transform:scale(.96) } 50% { opacity:1; transform:scale(1.05) } }
  @keyframes barrido { 0% { background-position:130% 0 } 60%,100% { background-position:-130% 0 } }

  h1 { font-size:1.3rem; margin:1rem 0 .4rem; font-weight:650; letter-spacing:.01em }
  #sub { color:var(--suave); margin:.2rem 0 1.1rem; line-height:1.45; max-width:340px }
  .barra { width:min(78vw,340px); height:6px; border-radius:99px; background:var(--linea); overflow:hidden }
  #relleno { height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#8d6a41,var(--oro-claro),#8d6a41); background-size:200% 100%; animation:reluce 1.8s linear infinite; transition:width .6s ease }
  @keyframes reluce { to { background-position:-200% 0 } }
  #estado { color:var(--suave); font-size:.85rem; margin:.7rem 0 .9rem; font-variant-numeric:tabular-nums }
  #entrar { display:none; background:var(--oro); color:#1c2632; text-decoration:none; font-weight:650; border-radius:8px; padding:.8rem 2.2rem; min-height:44px; animation:aparece .5s ease both }
  #entrar:hover { background:var(--oro-claro) }
  @keyframes aparece { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  .nota { position:fixed; left:0; right:0; bottom:calc(.8rem + env(safe-area-inset-bottom,0px)); z-index:2; text-align:center; font-size:.75rem; color:var(--suave) }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important } }
</style>
</head>

  <h1 id="titulo">Estamos preparando el sistema</h1>
  <p id="sub">Esto puede demorar hasta un minuto. No cierres esta página.</p>
  <div class="barra"><div id="relleno"></div></div>
  <p id="estado">Arrancando… 0 s</p>
  <a id="entrar" href="#">Entrar</a>
</main>

<script>
// Archivo único (el logo está incluido): se puede abrir desde el teléfono o la PC, compartir por WhatsApp o alojar donde quieras.
// Dirección real de la aplicación en Render (sin barra final). Cambiala si cambia la dirección del servicio.
const APP_URL = 'https://sistema-denuncias-6e88.onrender.com';
const DEMO = false, VEL = 1; // DEMO/VEL solo se usan en la vista previa

// La ruta a la que hay que llegar (firma, alta, comprobante) viaja en ?ir=/firmar/... ; solo se acepta una ruta dentro de la app.
const ir = new URLSearchParams(location.search).get('ir') || '';
const ruta = (ir.startsWith('/') && !ir.startsWith('//') && !ir.includes('\\')) ? ir : '/';
const destino = APP_URL + ruta;
const $ = id => document.getElementById(id);
if (!DEMO) $('entrar').href = destino;

// Olas doradas del fondo (el patrón se repite cada 1200 unidades para que el movimiento no tenga cortes)
function ola(base, amp, per, fase) { let d = ''; for (let x = 0; x <= 2400; x += 20) { d += (x ? 'L' : 'M') + x + ' ' + (base + amp * Math.sin(x / per * 2 * Math.PI + fase)).toFixed(1); } return d; }
[['.olas.a', 600, 14, 38, 0.2], ['.olas.b', 400, 9, 30, 0.35]].forEach(([sel, per, n, amp, paso]) => {
  const svg = document.querySelector(sel);
  for (let i = 0; i < n; i++) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', ola(110 + i * 9, amp + i, per, i * paso)); p.style.opacity = (1 - i / (n + 2)).toFixed(2); svg.appendChild(p); }
});

const t0 = Date.now(), seg = () => (Date.now() - t0) / 1000 * VEL;
let lista = false;
function pintar() {
  if (lista) return;
  const s = seg();
  $('relleno').style.width = (90 * (1 - Math.exp(-s / 45))).toFixed(1) + '%';
  $('estado').textContent = 'Arrancando… ' + Math.floor(s) + ' s';
  if (s >= 120) { $('sub').textContent = 'Está tardando más de lo normal. Probá con Entrar o recargá la página.'; $('entrar').style.display = 'inline-block'; }
  else if (s >= 20) { $('sub').textContent = 'El sistema ya debería estar listo. Presioná el botón Entrar.'; $('entrar').style.display = 'inline-block'; }
}
setInterval(pintar, 500); pintar();

async function consulta() {
  if (DEMO) return seg() >= 50;
  const c = new AbortController(), t = setTimeout(() => c.abort(), 8000);
  try { const r = await fetch(APP_URL + '/salud', { cache: 'no-store', signal: c.signal }); const j = await r.json(); return !!(j && j.ok === true); }
  catch (e) { return false; } // mientras Render la despierta, la respuesta no es la de la app
  finally { clearTimeout(t); }
}
(async function esperar() {
  for (;;) {
    if (await consulta()) {
      lista = true;
      $('titulo').textContent = '¡Listo!'; $('sub').textContent = 'Entrando al sistema…';
      $('relleno').style.width = '100%'; $('estado').textContent = 'Sistema disponible'; $('entrar').style.display = 'inline-block';
      if (DEMO) setTimeout(() => location.reload(), 5000); else setTimeout(() => location.replace(destino), 800);
      return;
    }
    await new Promise(r => setTimeout(r, 3000 / VEL));
  }
})();
</script>
